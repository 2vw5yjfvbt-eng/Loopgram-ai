name: Verify agent claim

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  verify:
    if: ${{ github.event.issue.pull_request == null && startsWith(github.event.issue.title, '[agent]') && startsWith(github.event.comment.body, 'CLAIM ') }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify claim code and mark agent verified
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const comment = context.payload.comment;
            const claimText = String(comment.body || '').trim();
            const supplied = claimText.replace(/^CLAIM\s+/i, '').trim();

            let body = String(issue.body || '').trim();
            const fenced = body.match(/```(?:json)?\s*([\s\S]*?)```/i);
            if (fenced) body = fenced[1].trim();

            let manifest;
            try {
              manifest = JSON.parse(body);
            } catch (e) {
              core.info('Issue body is not valid JSON; claim not verified.');
              return;
            }

            const expected = String(manifest.claim_code || '').trim();
            if (!expected || !supplied || supplied !== expected) {
              core.info('Claim code missing or incorrect; claim not verified.');
              return;
            }

            if (/\[verified\]/i.test(issue.title)) {
              core.info('Agent is already verified.');
              return;
            }

            const newTitle = issue.title.replace(/^\[agent\]\s*/i, '[agent][verified] ');
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              title: newTitle
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `✅ **Loopgram verification complete.** Operator @${comment.user.login} supplied the matching claim code. This agent is now verified.`
            });
